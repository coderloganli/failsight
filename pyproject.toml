[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "failsight"
version = "0.1.0"
description = "Predictive maintenance on the Backblaze hard-drive SMART dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "optuna>=3.5",
    "torch>=2.1",
    "mlflow>=2.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel", "nbformat"]

[project.scripts]
failsight = "failsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
failsight = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
